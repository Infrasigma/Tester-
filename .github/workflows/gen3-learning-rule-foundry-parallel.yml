name: Dispatch private ACSIE Gen3 Foundry to Kaggle

on:
  workflow_dispatch:
    inputs:
      acsie_ref:
        description: Exact ACSIE branch, tag, or commit to use as source
        required: true
        type: string
        default: 3fe72e9633ec8e762ca674df5c0e664b7bafd222

permissions:
  contents: read

jobs:
  dispatch-private-kaggle-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out public orchestration code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Require managed credentials
        shell: bash
        env:
          ACSIE_READ_TOKEN: ${{ secrets.ACSIE_READ_TOKEN }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${ACSIE_READ_TOKEN:-}" ]] || {
            echo "::error::Add Tester- repository secret ACSIE_READ_TOKEN (fine-grained Contents: read, only Infrasigma/ACSIE)."
            exit 1
          }
          [[ -n "${KAGGLE_API_TOKEN:-}" ]] || {
            echo "::error::Add Tester- repository secret KAGGLE_API_TOKEN. A secret saved in ACSIE is not visible to this public repository."
            exit 1
          }

      - name: Check out exact private ACSIE source
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: ${{ inputs.acsie_ref }}
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie-source
          fetch-depth: 1
          persist-credentials: false

      - name: Stage private kernel payload (Python sources only)
        shell: bash
        env:
          ACSIE_REF: ${{ inputs.acsie_ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -f acsie-source/research/gen3_learning_rule_foundry_v1.py
          test -f acsie-source/cognitive_core/native_independent_core.py
          ACSIE_SOURCE_SHA="$(git -C acsie-source rev-parse HEAD)"
          mkdir -p kaggle-kernel
          cp run_kaggle_foundry.py kernel-metadata.json kaggle-kernel/
          cp -R acsie-source/cognitive_core kaggle-kernel/cognitive_core
          while IFS= read -r -d '' src; do
            rel="${src#acsie-source/}"
            mkdir -p "kaggle-kernel/$(dirname "$rel")"
            cp "$src" "kaggle-kernel/$rel"
          done < <(find acsie-source/research -type f -name '*.py' -print0)
          python - "$ACSIE_SOURCE_SHA" "$ACSIE_REF" "$WORKFLOW_SHA" <<'PY'
          import json, pathlib, sys
          sha, ref, workflow_sha = sys.argv[1:]
          manifest = {
              "schema": "ACSIE.kaggle-source-manifest.v1",
              "repository": "Infrasigma/ACSIE",
              "source_commit": sha,
              "requested_ref": ref,
              "orchestration_commit": workflow_sha,
              "foundry_entrypoint": "research/gen3_learning_rule_foundry_v1.py",
              "network_during_research": False,
          }
          pathlib.Path("kaggle-kernel/source-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          metadata = json.loads(pathlib.Path("kaggle-kernel/kernel-metadata.json").read_text())
          assert metadata.get("id") == "memorican/acsie-gen3-foundry"
          assert str(metadata.get("is_private", "")).lower() == "true"
          assert str(metadata.get("enable_internet", "")).lower() == "false"
          print(f"Prepared private kernel payload for ACSIE source {sha}; no artifacts or logs were staged.")
          PY
          echo "acsie_source_commit=$ACSIE_SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "kaggle_kernel=memorican/acsie-gen3-foundry (private, internet disabled)" >> "$GITHUB_STEP_SUMMARY"
          echo "The pinned Foundry source has no explicit 12-generation driver; its candidate will remain non-qualifying until a real generation matrix is present." >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python for Kaggle CLI
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check --no-cache-dir "kaggle>=2.2.5"

      - name: Push and run private Kaggle kernel
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: kaggle kernels push --path kaggle-kernel
