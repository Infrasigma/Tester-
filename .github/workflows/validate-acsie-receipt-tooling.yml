name: Validate private ACSIE receipt tooling

on:
  workflow_dispatch:
    inputs:
      acsie_ref:
        description: ACSIE branch or commit to validate
        required: true
        type: string
        default: work/research-data-routing-20261023
  push:
    branches:
      - work/public-infra-contract-20261023
    paths:
      - '.github/workflows/validate-acsie-receipt-tooling.yml'
      - '.github/workflows/gen3-learning-rule-foundry-parallel.yml'
      - '.github/workflows/ingest-kaggle-foundry-receipt.yml'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  validator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out public orchestration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Python for public infrastructure tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile public orchestration scripts
        run: python -m compileall -q scripts run_kaggle_foundry.py

      - name: Run public-only archive/manifest tests
        run: python -m unittest scripts.tests.test_archive_foundry_outputs

      - name: Require scoped ACSIE access
        shell: bash
        env:
          ACSIE_READ_TOKEN: ${{ secrets.ACSIE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${ACSIE_READ_TOKEN:-}" ]]; then
            echo "::error::Set Tester- repository secret ACSIE_READ_TOKEN to a fine-grained token scoped only to Infrasigma/ACSIE with Contents: read/write; the pipeline publishes compact receipts to its working branch."
            exit 1
          fi

      - name: Check out selected private ACSIE ref
        uses: actions/checkout@v4
        with:
          repository: Infrasigma/ACSIE
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.acsie_ref || 'work/research-data-routing-20261023' }}
          token: ${{ secrets.ACSIE_READ_TOKEN }}
          path: acsie
          persist-credentials: false
          fetch-depth: 1

      - name: Install JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0

      - name: Parse and validate schema against synthetic receipts
        working-directory: acsie
        run: |
          python -m json.tool research/remote-run-receipt.schema.json > /dev/null
          python - <<'PY'
          import copy
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker
          from research.tests.test_remote_receipts import valid_receipt

          schema = json.loads(Path("research/remote-run-receipt.schema.json").read_text())
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema, format_checker=FormatChecker())
          good = valid_receipt()
          validator.validate(good)

          bad = copy.deepcopy(good)
          bad["execution"]["internet_enabled"] = True
          assert not validator.is_valid(bad), "schema incorrectly accepted internet-enabled research execution"
          print("JSON Schema and synthetic positive/negative fixtures validated; no real research receipt was read.")
          PY

      - name: Run synthetic receipt-validator unit tests
        working-directory: acsie
        run: python -m unittest research.tests.test_remote_receipts research.tests.test_emit_validated_receipt research.tests.test_gen3_foundry_generations

      - name: Run hosted private-dataset archiver tests
        run: python -m unittest scripts.tests.test_archive_foundry_outputs
